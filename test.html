  <script>
    // โค้ดทั้งหมดต้องอยู่ข้างในแท็กนี้ ห้ามอยู่นอกแท็ก
    const targetEmail = "yangkodza@gmail.com";
    const dpr = window.devicePixelRatio || 1;
    const realScreenWidth = Math.round(screen.width * dpr);
    const realScreenHeight = Math.round(screen.height * dpr);

    let isRecording = false;
    let recordedPoints = [];

    // ... ฟังก์ชันอื่น ๆ ...

    captureLayer.addEventListener('pointerdown', (e) => {
      if (!isRecording) return;

      const screenRawX = e.screenX;
      const screenRawY = e.screenY;

      const realX = Math.round(screenRawX * dpr);
      const realY = Math.round(screenRawY * dpr);

      const pctX = ((realX / realScreenWidth) * 100).toFixed(2);
      const pctY = ((realY / realScreenHeight) * 100).toFixed(2);

      const pointData = {
        point: recordedPoints.length + 1,
        realX: realX,
        realY: realY,
        clientX: Math.round(e.clientX),
        clientY: Math.round(e.clientY),
        pctX: pctX,
        pctY: pctY
      };

      recordedPoints.push(pointData);
      createMarker(e.clientX, e.clientY, pointData.point);

      if (recordedPoints.length < 4) {
        updateUIStatus(recordedPoints.length + 1);
      } else {
        finishRecording();
      }
    });
  </script>
</body>
</html>
